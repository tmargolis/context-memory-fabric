[project]
name = "context-memory-fabric"
version = "0.1.0"
description = "A portable context and memory substrate shared across AI clients"
readme = "README.md"
authors = []
requires-python = ">=3.12"
dependencies = [
    "graphiti-core[falkordb,google-genai]>=0.29.3",
    "mcp>=2.1.1",
    "pypdf>=6.16.2",
    "python-dotenv>=1.2.3",
]

[project.scripts]
context-memory-fabric = "context_memory_fabric:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.pyrefly]
search-path = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
