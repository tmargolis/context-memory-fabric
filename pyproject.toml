[project]
name = "context-memory-fabric"
version = "0.1.0"
description = "A portable context and memory substrate shared across AI clients"
readme = "README.md"
authors = []
requires-python = ">=3.12"
dependencies = [
    "graphiti-core[anthropic,falkordb,google-genai]>=0.29.3",
    "mcp>=2.1.1",
    "pypdf>=6.16.2",
    "python-dotenv>=1.2.3",
]

[project.scripts]
context-memory-fabric = "server.mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]

[tool.pyrefly]
search-path = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# Tests marked `live` call the real Gemini API. They are excluded by default:
# they make the suite roughly 35x slower (27s -> 15+ min, almost entirely
# blocked on network and retry backoff), they spend real free-tier quota, and
# they cannot run without a key -- so on an exhausted quota day they fail for
# reasons that have nothing to do with the code under test.
#
# Run them deliberately with:   uv run pytest -m live
# Run everything with:          uv run pytest -m ""
#
# A CLI -m overrides the one in addopts (pytest keeps the last -m it sees),
# which is what makes both commands above work.
addopts = '-m "not live"'
# Only tests/: imports/ can hold backup copies of test files (gitignored), which
# otherwise break collection with "import file mismatch".
testpaths = ["tests"]
markers = [
    "live: hits the real Gemini API -- costs quota, needs GEMINI_API_KEY, slow",
]
