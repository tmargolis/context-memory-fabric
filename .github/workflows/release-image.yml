# Publish the CMF server image (also runs the capture poller) to GitHub
# Container Registry, for the no-checkout Docker stack in deploy/docker/.
#
#   ghcr.io/tmargolis/context-memory-fabric:<version>   from a v<version> tag
#   ghcr.io/tmargolis/context-memory-fabric:latest      the newest tagged release
#
# Multi-arch (arm64 for Apple Silicon, amd64 for Intel/Windows/Linux).
# A manual run (workflow_dispatch) builds both platforms without pushing,
# to check the Dockerfile before tagging.
name: Release image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}

      - name: Build (and push on a tag)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
