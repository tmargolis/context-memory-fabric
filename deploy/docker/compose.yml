# Context Memory Fabric: the one Docker stack, run from ~/.cmf
# (docs/setup-simplification-plan.md, section 3.8 and Phase 2).
#
# Lives at ~/.cmf/compose.yml beside ~/.cmf/.env, so one folder holds the
# config, the state and the stack, and no repo checkout is needed:
#
#   cd ~/.cmf && docker compose up -d                       # server + FalkorDB
#   cd ~/.cmf && docker compose --profile capture up -d     # + capture poller
#
# Developer mode adds ~/.cmf/compose.override.yml (from deploy/docker/
# compose.dev.yml), which docker compose merges in automatically.
#
# Everything reads the same ~/.cmf/.env: the server and poller get all of it
# (env_file), and the published ports come from the same FALKORDB_PORT /
# CMF_MCP_PORT that host-side tools read, so the two can't disagree.

name: cmf

services:
  falkordb:
    image: falkordb/falkordb@sha256:adbddd418916c25618564ff8597a919b08bc76452ebeb74eb985c38d7281df62
    container_name: cmf-falkordb
    ports:
      - "127.0.0.1:${FALKORDB_PORT:-6379}:6379"
      - "127.0.0.1:${CMF_BROWSER_PORT:-3001}:3000"
    volumes:
      - falkordb_data:/data
    environment:
      # The image's default data dir is inside the container; point it at the
      # volume or every recreate loses the graphs.
      - FALKORDB_DATA_PATH=/data
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-}
      - FALKORDB_ARGS=MAX_QUEUED_QUERIES 25 TIMEOUT 30000 RESULTSET_SIZE 10000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  cmf-server:
    image: ghcr.io/tmargolis/context-memory-fabric:${CMF_VERSION:-latest}
    container_name: cmf-server
    ports:
      - "127.0.0.1:${CMF_MCP_PORT:-8000}:8000"
    depends_on:
      falkordb:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      # Inside the stack FalkorDB is always falkordb:6379, whatever port it is
      # published on for the host.
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
      - FALKORDB_DATABASE=${FALKORDB_DATABASE:-cmf}
      - LLM_WIKI_PATH=${LLM_WIKI_PATH:+/wiki}
      # Local model URLs in .env can say 127.0.0.1: the server rewrites them
      # to host.docker.internal when it runs in a container (server.core.config).
      - CMF_STATE_DIR=/data/cmf
      - CMF_JOURNAL_VOLUME=cmf-journal
    volumes:
      # Your notes, read-write so approved doc proposals can be applied
      # (apply_doc_proposal / confirm_review_recommendations). Nothing is
      # written without an approved proposal. Unset LLM_WIKI_PATH = memory
      # only (an empty folder is mounted and the wiki tools stay off).
      - ${LLM_WIKI_PATH:-./empty/wiki}:/wiki:rw
      # Proposals, imports and your review rules, shared with host-side tools.
      - ./state:/data/cmf
      # The SQLite journal stays in a Docker volume: SQLite breaks when the
      # host and a container open one file through Docker Desktop's file
      # sharing. Host-side journal tools run via `docker compose exec`.
      - journal:/data/cmf/imports/journal
    restart: unless-stopped

  cmf-poller:
    # Captures Claude Code, Codex, Antigravity and local Cowork transcripts
    # every CMF_CAPTURE_INTERVAL seconds. Off unless the "capture" profile is
    # on (COMPOSE_PROFILES=capture in .env, or --profile capture).
    image: ghcr.io/tmargolis/context-memory-fabric:${CMF_VERSION:-latest}
    container_name: cmf-poller
    profiles: ["capture"]
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do
          python -m server.adapters.capture_runner tail
          sleep "$${CMF_CAPTURE_INTERVAL:-900}"
        done
    depends_on:
      falkordb:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
      - FALKORDB_DATABASE=${FALKORDB_DATABASE:-cmf}
      - LLM_WIKI_PATH=${LLM_WIKI_PATH:+/wiki}
      - CMF_STATE_DIR=/data/cmf
      - CMF_JOURNAL_VOLUME=cmf-journal
      # Your real home path, so transcript folders are found where the
      # adapters look (~/.claude/projects, ...) and project names derived from
      # the paths inside transcripts (/Users/you/Dev/<project>) still match.
      - HOME=${HOME}
      - CMF_COWORK_SESSIONS_ROOT=${HOME}/.cmf-cowork-sessions
    volumes:
      - ${LLM_WIKI_PATH:-./empty/wiki}:/wiki:ro
      - ./state:/data/cmf
      - journal:/data/cmf/imports/journal
      # One transcript folder per source, read-only. Each defaults to an empty
      # folder in ~/.cmf, so a source is captured only after you point its
      # variable at the real folder (an absolute path; ~ is not expanded):
      #   CMF_CAPTURE_CLAUDE_CODE_DIR=/Users/you/.claude/projects
      #   CMF_CAPTURE_CODEX_DIR=/Users/you/.codex/sessions
      #   CMF_CAPTURE_ANTIGRAVITY_DIR=/Users/you/.gemini/antigravity
      #   CMF_CAPTURE_COWORK_DIR=/Users/you/Library/Application Support/Claude/local-agent-mode-sessions
      - ${CMF_CAPTURE_CLAUDE_CODE_DIR:-./empty/claude_code}:${HOME}/.claude/projects:ro
      - ${CMF_CAPTURE_CODEX_DIR:-./empty/codex}:${HOME}/.codex/sessions:ro
      - ${CMF_CAPTURE_ANTIGRAVITY_DIR:-./empty/antigravity}:${HOME}/.gemini/antigravity:ro
      - ${CMF_CAPTURE_COWORK_DIR:-./empty/cowork}:${HOME}/.cmf-cowork-sessions:ro
    restart: unless-stopped

volumes:
  falkordb_data:
  journal:
    name: cmf-journal
